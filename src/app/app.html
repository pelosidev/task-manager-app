<header class="app-header">
  <h1>Gestor de Tarefas Kanban</h1>

  <!-- Exibe as informações do utilizador se estiver logado -->
  <ng-container *ngIf="authService.user$ | async as user; else loggedOut">
    <div class="user-profile">
      <img [src]="user.photoURL" [alt]="user.displayName" class="avatar" />
      <span>Olá, {{ user.displayName }}</span>
      <button (click)="logout()" class="btn-logout">Sair</button>
    </div>
  </ng-container>

  <!-- Exibe o botão de login se não estiver logado -->
  <ng-template #loggedOut>
    <button (click)="login()" class="btn-login">
      Entrar com Google
    </button>
  </ng-template>
</header>

<main>
  <app-kanban-board></app-kanban-board>
</main>
